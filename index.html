<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Ridimensiona e comprimi immagini a massimo 600 KB direttamente nel browser.">
<title>Ridimensiona immagini</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap");
html{scrollbar-gutter:stable}
:root{color-scheme:light;--bg:#f2f1ee;--fg:#292929;--muted:#777777;--line:rgba(41,41,41,.25);--hover:rgba(41,41,41,.05)}
@media(prefers-color-scheme:dark){:root:not(.light){color-scheme:dark;--bg:#161616;--fg:#e5e5e2;--muted:#a0a09d;--line:rgba(229,229,226,.28);--hover:rgba(229,229,226,.07)}}
:root.dark{color-scheme:dark;--bg:#161616;--fg:#e5e5e2;--muted:#a0a09d;--line:rgba(229,229,226,.28);--hover:rgba(229,229,226,.07)}
:root.light{color-scheme:light;--bg:#f2f1ee;--fg:#292929;--muted:#777777;--line:rgba(41,41,41,.25);--hover:rgba(41,41,41,.05)}
*{box-sizing:border-box}
body{font-family:"Jost",sans-serif;font-size:18px;font-weight:400;line-height:1.8;margin:0;padding:36px 24px;background:var(--bg);color:var(--fg);transition:background .2s,color .2s}
main{width:min(100%,600px);margin:0 auto;padding:0 0 30px}
header{max-width:600px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
header a{color:var(--fg);text-decoration:none;font-family:"Jost",sans-serif;font-size:30px;font-weight:600;letter-spacing:-.03em;transition:opacity .2s}
header a:hover{opacity:.7}
.theme{width:44px;height:28px;min-width:44px;padding:5px;border:0;border-radius:99px;background:var(--fg);cursor:pointer;display:flex;align-items:center;flex:0 0 44px;touch-action:manipulation}
.theme::before{content:"";width:18px;height:18px;flex:0 0 18px;border-radius:50%;background:var(--bg);transition:transform .22s ease}
@media(prefers-color-scheme:dark){:root:not(.light) .theme::before{transform:translateX(16px) scale(1.03)}}
:root.dark .theme::before{transform:translateX(16px) scale(1.03)}
:root.light .theme::before{transform:translateX(0) scale(1)}
h1,h2,h3{font-family:"Jost",sans-serif;font-weight:600}
h1{margin:0 0 10px;font-size:30px;line-height:1.2;letter-spacing:-1.2px}
h2{margin:0 0 10px;font-size:24px}
p{font-family:"Jost",sans-serif;font-size:18px;font-weight:400;line-height:1.8;margin:0 0 16px}
.tool{margin-top:36px}
.drop{border:1px dashed var(--line);padding:26px 20px;text-align:center;transition:background .2s,border-color .2s}
.drop.drag{border-color:var(--fg);background:var(--hover)}
.drop p{margin-bottom:15px}
.btn{border:1px solid var(--fg);border-radius:0;background:var(--fg);color:var(--bg);padding:7px 12px;font-family:"Jost",sans-serif;font-size:15px;font-weight:400;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.7}
.btn:disabled{opacity:.35;cursor:default}
.btn.alt{background:transparent;color:var(--fg)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;margin:24px 0}
.field label{display:block;font-size:15px;font-weight:300;color:var(--muted);margin-bottom:6px}
.field input[type=number]{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--fg);font:inherit;padding:7px 0;outline-offset:3px}
.strategy-field{grid-column:1/-1}
.strategy-choice{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.strategy-option{padding:10px 8px;border:1px solid var(--line);border-bottom:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;line-height:1.4;cursor:pointer;transition:background .2s,color .2s}
.strategy-option+.strategy-option{border-left:0}
.strategy-option.selected{background:var(--fg);color:var(--bg)}
.strategy-option:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
.summary{font-size:14px;color:var(--muted);margin:12px 0}
.progress{height:2px;background:var(--line);margin-top:14px}
.progress span{display:block;height:100%;width:0;background:var(--fg);transition:width .15s}
.results{margin-top:34px}
.results h2{font-size:24px;margin:0 0 10px}
.file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.filename{overflow-wrap:anywhere;font-size:16px}
.meta,.status{font-size:14px;color:var(--muted)}
.status{text-align:right}
.status.good{color:var(--fg)}
.download{display:inline-block;color:var(--fg);font-size:15px;margin-top:3px}
.download:hover{opacity:.7}
.ziprow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}
.hidden{display:none!important}
.foot{font-size:14px;font-weight:300;color:var(--muted);margin-top:30px}
@media(max-width:600px){body{padding:24px 18px}header a{font-size:27px}.tool{margin-top:30px}.controls{gap:16px}.drop{padding:23px 12px}.file{grid-template-columns:minmax(0,1fr) auto;gap:8px}}
</style>
</head>
<body>
<main>
  <header><a href="#">Ridimensiona immagini</a><button class="theme" id="theme" type="button" role="switch" aria-label="Cambia tema" aria-checked="false"></button></header>
  <section class="tool">
    <div class="drop" id="drop"><p id="droptext">Trascina qui le immagini oppure</p><div class="actions" style="justify-content:center;margin:0"><button class="btn alt" id="chooseFiles" type="button">Scegli immagini</button><button class="btn alt" id="chooseFolder" type="button">Scegli cartella</button></div><input id="picker" type="file" accept="image/jpeg,image/png,image/webp,image/bmp" multiple hidden><input id="folderPicker" type="file" accept="image/jpeg,image/png,image/webp,image/bmp" webkitdirectory multiple hidden></div>
  </section>
  <section class="controls" aria-label="Impostazioni">
    <div class="field"><label for="maxkb">Peso massimo per immagine (KB)</label><input id="maxkb" type="number" min="50" max="10000" step="50" value="600"></div>
    <div class="field strategy-field"><label>Metodo</label><div class="strategy-choice" role="group" aria-label="Metodo di ridimensionamento"><button class="strategy-option selected" id="balanced" type="button" aria-pressed="true">Qualità prima, poi dimensioni</button><button class="strategy-option" id="dimensions" type="button" aria-pressed="false">Riduci prima le dimensioni</button></div></div>
  </section>
  <div class="actions"><button class="btn" id="process" disabled type="button">Ridimensiona immagini</button><button class="btn alt" id="clear" disabled type="button">Azzera</button></div>
  <div id="summary" class="summary" aria-live="polite">Nessuna immagine selezionata.</div>
  <div class="progress"><span id="overall"></span></div>
  <section class="results hidden" id="resultsPanel"><h2>Risultati</h2><div id="results"></div><div class="ziprow"><span class="meta" id="zipstatus"></span><button class="btn alt" id="zip" disabled type="button">Scarica tutto (ZIP)</button></div></section>
  <p class="foot">Le immagini vengono elaborate nel browser e non vengono caricate online. Gli originali non vengono mai modificati. I file TIFF non sono supportati dai browser più comuni; BMP viene salvato come PNG.</p>
</main>
<script>
(() => {
 const $=id=>document.getElementById(id), state=[];
 const drop=$('drop'), picker=$('picker'), folderPicker=$('folderPicker');
 let strategyValue='balanced';
 const strategyButtons=[$('balanced'),$('dimensions')];
 function updateStrategy(value=strategyValue){
   strategyValue=value;
   strategyButtons.forEach((button,index)=>{
     const selected=(index===0&&value==='balanced')||(index===1&&value==='dimensions');
     button.classList.toggle('selected',selected);
     button.setAttribute('aria-pressed',String(selected));
   });
 }
 strategyButtons[0].addEventListener('click',()=>updateStrategy('balanced'));
 strategyButtons[1].addEventListener('click',()=>updateStrategy('dimensions'));
 const root=document.documentElement, system=matchMedia('(prefers-color-scheme: dark)');
 function isDarkMode(){try{const manual=sessionStorage.getItem('theme');if(manual==='dark')return true;if(manual==='light')return false}catch{}return system.matches}
 function applyTheme(theme){root.classList.remove('dark','light');if(theme)root.classList.add(theme);$('theme').setAttribute('aria-checked',String(isDarkMode()))}
 let initialTheme=null;try{const saved=sessionStorage.getItem('theme');if(saved==='dark'||saved==='light')initialTheme=saved}catch{}
 applyTheme(initialTheme);
 system.addEventListener('change',()=>{let saved=null;try{saved=sessionStorage.getItem('theme')}catch{}if(saved===null)applyTheme(null)});
 $('theme').addEventListener('click',()=>{const next=isDarkMode()?'light':'dark';try{sessionStorage.setItem('theme',next)}catch{}applyTheme(next)});
 $('chooseFiles').addEventListener('click',()=>picker.click());
 $('chooseFolder').addEventListener('click',()=>folderPicker.click());
 picker.addEventListener('change',e=>{addFiles([...e.target.files]);picker.value=''});
 folderPicker.addEventListener('change',e=>{addFiles([...e.target.files]);folderPicker.value=''});
 drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
 drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
 drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');addFiles([...e.dataTransfer.files])});
 $('process').addEventListener('click',processAll);
 $('clear').addEventListener('click',clearAll);
 $('zip').addEventListener('click',downloadZip);
 function clearAll(){state.forEach(x=>{if(x.blobUrl)URL.revokeObjectURL(x.blobUrl)});state.splice(0);render();$('overall').style.width='0';$('summary').textContent='Nessuna immagine selezionata.'}
 function addFiles(files){
   const accepted=files.filter(f=>/\.(jpe?g|png|webp|bmp)$/i.test(f.name)||['image/jpeg','image/png','image/webp','image/bmp'].includes(f.type));
   let added=0;
   for(const file of accepted){if(state.some(x=>x.file.name===file.name&&x.file.size===file.size&&x.file.lastModified===file.lastModified))continue;state.push({file,status:'In attesa',blob:null,blobUrl:null,outputName:'',outputType:'',quality:null,dimensions:null});added++}
   render();
   if(files.length&&!accepted.length)$('summary').textContent='Nessun formato supportato. Seleziona JPEG, PNG, WebP o BMP.';
   else if(accepted.length&&!added)$('summary').textContent='Queste immagini sono già nell’elenco.';
 }
 function fmt(bytes){return bytes<1024?bytes+' B':(bytes/1024).toFixed(1)+' KB'}
 function render(){
   $('process').disabled=!state.length;$('clear').disabled=!state.length;
   if(!$('process').disabled&&state.some(x=>x.status==='In elaborazione'))$('process').disabled=true;
   $('summary').textContent=state.length?state.length+' '+(state.length===1?'immagine selezionata':'immagini selezionate')+'.':'Nessuna immagine selezionata.';
   const list=$('results');list.replaceChildren();
   state.forEach(item=>{
     const row=document.createElement('div');row.className='file';
     const left=document.createElement('div'),name=document.createElement('div');name.className='filename';name.textContent=item.outputName||item.file.webkitRelativePath||item.file.name;
     const meta=document.createElement('div');meta.className='meta';meta.textContent=item.blob?fmt(item.file.size)+' → '+fmt(item.blob.size)+(item.dimensions?' · '+item.dimensions:''):(fmt(item.file.size)+' · Originale');
     left.append(name,meta);const right=document.createElement('div');right.className='status'+(item.blob?' good':'');right.textContent=item.status;
     if(item.blob){const a=document.createElement('a');a.className='download';a.href=item.blobUrl;a.download=item.outputName;a.textContent='Scarica';right.append(document.createElement('br'),a)}
     row.append(left,right);list.append(row);
   });
   $('resultsPanel').classList.toggle('hidden',!state.length);$('zip').disabled=!state.some(x=>x.blob);
 }
 function loadImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Formato non leggibile dal browser'))};img.src=url})}
 function encode(img,width,height,type,quality){
   return new Promise((resolve,reject)=>{
     const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
     const ctx=canvas.getContext('2d',{alpha:type!=='image/jpeg'});
     if(!ctx){reject(new Error('Canvas non disponibile'));return}
     if(type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height)}
     ctx.drawImage(img,0,0,width,height);
     canvas.toBlob(blob=>{canvas.width=canvas.height=0;if(!blob)reject(new Error('Compressione non riuscita'));else resolve(blob)},type,quality);
   });
 }
 async function compressImage(item,maxBytes,strategy){
   if(item.file.size<=maxBytes){
     item.blob=item.file;item.blobUrl=URL.createObjectURL(item.file);item.outputName=item.file.name;
     item.dimensions='Originale mantenuto';item.quality=null;item.status='Già entro il limite';return;
   }
   const img=await loadImage(item.file);
   const sourceType=(item.file.type||'').toLowerCase();
   let type=sourceType;
   if(type==='image/bmp'||!['image/jpeg','image/png','image/webp'].includes(type)){
     const ext=item.file.name.split('.').pop().toLowerCase();
     if(ext==='bmp')type='image/png';
     else throw new Error('Formato non supportato dal browser');
   }
   const extension=type==='image/jpeg'?'jpg':type==='image/webp'?'webp':'png';
   let width=img.naturalWidth,height=img.naturalHeight,blob=null,usedQuality=null;
   if(strategy==='balanced'&&(type==='image/jpeg'||type==='image/webp')){
     for(let q=90;q>=10;q-=5){
       const candidate=await encode(img,width,height,type,q/100);
       if(candidate.size<=maxBytes){blob=candidate;usedQuality=q;break}
     }
   }
   if(!blob){
     let scale=1;
     for(let attempt=0;attempt<35;attempt++){
       const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
       const q=(type==='image/jpeg'||type==='image/webp')?0.85:undefined;
       const candidate=await encode(img,w,h,type,q);
       if(candidate.size<=maxBytes){blob=candidate;width=w;height=h;usedQuality=q===undefined?null:Math.round(q*100);break}
       scale*=0.85;
     }
   }
   if(!blob)throw new Error('Non è stato possibile raggiungere il limite impostato');
   const base=item.file.name.replace(/\\.[^.]+$/,'');
   item.blob=blob;item.outputType=type;item.outputName=base+(type==='image/png'&&/\\.bmp$/i.test(item.file.name)?'.png':'.'+extension);
   item.blobUrl=URL.createObjectURL(blob);item.quality=usedQuality;item.dimensions=width+' × '+height+' px';
   item.status=blob.size<=maxBytes?'Completata':'Limite superato';
 }
 async function processAll(){
   const kb=Number($('maxkb').value),strategy=strategyValue;
   if(!Number.isFinite(kb)||kb<50||kb>10000){$('summary').textContent='Inserisci un limite tra 50 e 10.000 KB.';return}
   $('process').disabled=true;$('zip').disabled=true;
   state.forEach(x=>{if(x.blobUrl)URL.revokeObjectURL(x.blobUrl);x.blobUrl=null;x.blob=null;x.status='In elaborazione';x.outputName=''});
   render();let done=0,errors=0;
   for(const item of state){
     try{await compressImage(item,kb*1024,strategy)}catch(e){item.status='Errore';item.error=e.message;errors++}
     done++;$('overall').style.width=(done/state.length*100)+'%';render();
   }
   $('process').disabled=false;
   const successes=state.filter(x=>x.blob).length;
   $('summary').textContent='Completate '+successes+' di '+done+(errors?' · Errori '+errors:'')+'.';
 }
 async function downloadZip(){
   const files=state.filter(x=>x.blob);if(!files.length)return;
   $('zip').disabled=true;$('zipstatus').textContent='Preparo lo ZIP…';
   try{
     if(!window.JSZip)await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=resolve;s.onerror=reject;document.head.append(s)});
     const zip=new JSZip(),used=new Set();
     files.forEach(x=>{
       let name=x.outputName,n=1;
       while(used.has(name.toLowerCase())){const dot=x.outputName.lastIndexOf('.');name=x.outputName.slice(0,dot)+'_'+(n++)+x.outputName.slice(dot)}
       used.add(name.toLowerCase());zip.file(name,x.blob);
     });
     const blob=await zip.generateAsync({type:'blob'}),url=URL.createObjectURL(blob),a=document.createElement('a');
     a.href=url;a.download='immagini-ridimensionate.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);$('zipstatus').textContent='';
   }catch(e){$('zipstatus').textContent='ZIP non disponibile: scarica i file singolarmente.'}
   finally{$('zip').disabled=!state.some(x=>x.blob)}
 }
 render();
})();
</script>
</body>
</html>
